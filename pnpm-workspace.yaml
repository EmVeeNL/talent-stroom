packages:
  - apps/*
  - packages/*

# Single source of truth for shared dependency versions (use "catalog:" in package.json).
catalog:
  # TypeScript 7 (native compiler) builds and typechecks; see docs/adr/0003-typescript-7-toolchain.md
  typescript: 7.0.2
  "@astrojs/check": 0.9.12
  "@types/node": 26.6.5
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  astro: 7.4.2
  "@hono/zod-openapi": 1.6.3
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  hono: 4.13.13
  # UI component tests (packages/ui)
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  axe-core: 4.14.0
  jsdom: 30.1.3
  oxfmt: 0.74.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2004
  # Postgres driver (ADR 0007); Cloudflare Hyperdrive minimum is 8.16.3.
  pg: 8.23.1
  kysely: 0.29.7
  react: 19.3.1
  react-dom: 19.3.1
  turbo: 2.11.10
  vite: 8.3.5
  vitest: 5.0.5
  wrangler: 4.151.3
  zod: 4.6.7

# TypeScript 6 for packages whose only TypeScript consumer needs the JS API (astro check).
catalogs:
  typescript6:
    typescript: 6.0.3

# openapi-typescript declares typescript ^5 but works with 6 (output verified identical);
# it only runs in packages/openapi-codegen (ADR 0003).
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"

# Supply-chain policy: only install releases older than 7 days (minutes).
minimumReleaseAge: 10080

# Only these packages may run install scripts.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
