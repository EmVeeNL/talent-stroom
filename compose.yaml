# Local development services (ADR 0007 section 7). LOCAL ONLY: the password below is a
# throwaway for this container and is never used for Neon or any shared database.
#   pnpm db:up / db:down / db:reset / db:migrate   (see packages/database/README.md)
# Images are pinned to a version tag at least 7 days old plus its digest (ADR 0005).
name: talentstroom

services:
  postgres:
    # Postgres 18 = Neon's default major for new projects. Digest of 18.6-alpine built 2026-08-13.
    image: postgres:18.6-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_dev_only
      POSTGRES_DB: talentstroom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentstroom"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    # Development email catcher: SMTP 127.0.0.1:1025, web UI http://127.0.0.1:8025
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
