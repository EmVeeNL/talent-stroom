name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via Corepack
        run: corepack enable pnpm

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Generated Worker types are up to date
        run: |
          pnpm --filter @talentstroom/api cf-typegen
          git diff --exit-code -- apps/api/worker-configuration.d.ts || {
            echo "::error::apps/api/worker-configuration.d.ts is stale. Run 'pnpm --filter @talentstroom/api cf-typegen' and commit."
            exit 1
          }

      - name: Generated OpenAPI contract is up to date
        run: |
          pnpm --filter @talentstroom/api openapi
          git diff --exit-code -- apps/api/openapi.json || {
            echo "::error::apps/api/openapi.json is stale. Run 'pnpm --filter @talentstroom/api openapi' and commit."
            exit 1
          }
