name: Spike / ADR / proof of concept
description: Time-boxed research or decision that unblocks implementation.
title: "[Spike] "
labels: ["type:spike"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent epic
      placeholder: "#12"

  - type: input
    id: decision
    attributes:
      label: Open decision
      description: From docs/architecture/decisions/01-open-decisions.md, if applicable.
      placeholder: D14 — Worker PG driver and KMS

  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options considered
      placeholder: |
        1. ...
        2. ...

  - type: textarea
    id: criteria
    attributes:
      label: Evaluation criteria
      placeholder: |
        - p95 latency
        - EU residency
        - cost per 1k operations
        - security posture
    validations:
      required: true

  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: 3 days
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Expected output
      value: |
        - [ ] Written findings with measurements
        - [ ] ADR in docs/adr/ (context, options, consequences, rollback)
        - [ ] Follow-up issues created
