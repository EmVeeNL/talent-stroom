version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - area:ci-cd
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      runtime-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript majors are migrated manually; apps/site must stay on 6 (ADR 0003, 0009).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - area:ci-cd
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
